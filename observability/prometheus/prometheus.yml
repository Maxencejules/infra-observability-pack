global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: procurement-platform
    metrics_path: /metrics
    static_configs:
      - targets: ['procurement-platform:8000']
  - job_name: integrations-hub
    metrics_path: /metrics
    static_configs:
      - targets: ['integrations-hub:8000']
