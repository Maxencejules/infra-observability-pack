apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations-hub
  namespace: portfolio
  labels:
    app: integrations-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrations-hub
  template:
    metadata:
      labels:
        app: integrations-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: integrations-hub
          image: integrations-hub:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: INTEGRATIONS_DATABASE_URL
            - name: IH_DATABASE_URL_SYNC
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: INTEGRATIONS_DATABASE_URL_SYNC
          envFrom:
            - configMapRef:
                name: integrations-hub-config
            - secretRef:
                name: integrations-hub-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
