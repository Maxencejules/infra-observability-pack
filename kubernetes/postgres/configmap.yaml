apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: portfolio
  labels:
    app: postgres
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE procurement;
      CREATE DATABASE integrations_hub;
    EOSQL
