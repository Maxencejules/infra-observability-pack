apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: portfolio
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  # Connection strings for each app
  PROCUREMENT_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/procurement"
  PROCUREMENT_DATABASE_URL_SYNC: "postgresql://postgres:postgres@postgres:5432/procurement"
  INTEGRATIONS_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/integrations_hub"
  INTEGRATIONS_DATABASE_URL_SYNC: "postgresql://postgres:postgres@postgres:5432/integrations_hub"
