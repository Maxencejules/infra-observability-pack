name: Observability proof

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-checks.txt
      - run: bash ci/install-tools.sh
      - run: bash ci/lint-yaml.sh
      - run: bash ci/validate-manifests.sh
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/k6-contracts.mjs
      - run: shellcheck --severity=warning scripts/*.sh ci/*.sh load-testing/*.sh
      - run: promtool check config --syntax-only observability/prometheus/prometheus.yml
      - run: promtool check rules observability/prometheus/rules.yml
      - run: promtool test rules observability/prometheus/rules.test.yml
      - run: python ci/check_k6.py --k6 k6
      - run: python ci/check_prometheus.py --prometheus prometheus --k6 k6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-monitoring-proof
          path: |
            .local/rendered.yaml
            .local/k6-proof/*.json*
            .local/k6-proof/*.log
            .local/prometheus-proof/*.json*
            .local/prometheus-proof/*.yml
            .local/prometheus-proof/*.log
          include-hidden-files: true

  kind:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt
      - run: bash ci/install-tools.sh
      - run: bash ci/kind-proof.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kind-monitoring-proof
          path: |
            .local/kind-proof/*.json
            .local/kind-proof/*.log
            .local/kind-proof/*.txt
            .local/kind-proof/k6/
            .local/*-forward.log
            .local/images.json
          include-hidden-files: true
